# Boat GitHub Actions runner labels (https://docs.boat.dev/ci.md). Options after "/" (e.g. boat-large/debug)
# are matched by the trailing glob.
self-hosted-runner:
  labels:
    - boat
    - boat-small
    - boat-large
    - boat-xlarge
    - boat/*
    - boat-small/*
    - boat-large/*
    - boat-xlarge/*
