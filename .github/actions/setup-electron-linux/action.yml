name: Set up Electron on Linux
description: Install missing system packages, reuse package downloads, and configure fonts and Chromium sandboxing.
runs:
  using: composite
  steps:
    - name: Cache Electron system package downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # Do not archive apt's root-owned lock/partial directories.
        path: ${{ runner.temp }}/verynize-electron-apt/*.deb
        key: electron-apt-ubuntu2404-${{ runner.arch }}-v1-${{ hashFiles('.github/actions/setup-electron-linux/packages.txt') }}
    - name: Prepare Linux dependencies, fonts and sandbox
      shell: bash
      env:
        ELECTRON_APT_ARCHIVES: ${{ runner.temp }}/verynize-electron-apt
      run: bash "$GITHUB_ACTION_PATH/setup.sh"
